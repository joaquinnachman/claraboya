name: App Android

# - Cada cambio en "proxima": arma la APK de prueba (Release "prueba", no es la oficial).
# - Desde "Publicar versión" (los lunes): arma la APK oficial con el número de VERSION.
on:
  push:
    branches: [proxima]
    paths-ignore: ['**.md']
  workflow_dispatch:
  workflow_call:
    inputs:
      oficial:
        type: boolean
        default: false
      ref:
        type: string
        default: ''

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OFICIAL: ${{ inputs.oficial && 'si' || 'no' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Armar la web y el contenido de la app
        run: |
          node scripts/build.mjs
          node scripts/check.mjs
          node scripts/build-app.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Versión
        id: v
        run: |
          V=$(cat VERSION)
          IFS=. read -r MA MI PA <<< "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=$((MA * 10000 + MI * 100 + PA))" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Instalar Capacitor
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Crear proyecto Android
        working-directory: app
        run: npx cap add android

      - name: Ajustes nativos
        working-directory: app
        run: |
          set -e
          cp native/MainActivity.java android/app/src/main/java/com/claraboya/app/MainActivity.java
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />#' $M
          grep -q RECORD_AUDIO $M && grep -q VIBRATE $M
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ steps.v.outputs.code }}/; s/versionName \"[^\"]*\"/versionName \"${{ steps.v.outputs.version }}\"/" $G
          grep -E "versionCode|versionName" $G

      - name: Ícono y pantalla de inicio
        working-directory: app
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'

      - name: Sincronizar
        working-directory: app
        run: npx cap sync android

      - name: Compilar (firmada con la llave de Claraboya)
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/app/keystore/claraboya.jks \
            -Pandroid.injected.signing.store.password=claraboya-app \
            -Pandroid.injected.signing.key.alias=claraboya \
            -Pandroid.injected.signing.key.password=claraboya-app
          cp app/build/outputs/apk/release/app-release.apk $GITHUB_WORKSPACE/Claraboya.apk
          ls -la $GITHUB_WORKSPACE/Claraboya.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Claraboya-${{ steps.v.outputs.version }}
          path: Claraboya.apk

      - name: Publicar APK de prueba
        if: env.OFICIAL == 'no'
        run: |
          gh release delete prueba --yes --cleanup-tag || true
          gh release create prueba Claraboya.apk --prerelease --target ${{ steps.v.outputs.sha }} \
            --title "Claraboya ${{ steps.v.outputs.version }} · prueba" \
            --notes "APK de prueba con lo que se va juntando para la próxima versión (todavía no está en la web). Se instala encima de la anterior."

      - name: Publicar APK oficial
        if: env.OFICIAL == 'si'
        run: |
          V=${{ steps.v.outputs.version }}
          awk -v v="$V" '$0 ~ "^## "v" " {f=1; next} /^## / && f {exit} f' CAMBIOS.md > notas.md
          [ -s notas.md ] || echo "Versión $V." > notas.md
          gh release create "v$V" Claraboya.apk --latest --target ${{ steps.v.outputs.sha }} --title "Claraboya $V" --notes-file notas.md
