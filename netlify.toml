# Netlify publica solo cada vez que se sube algo a la rama main de este repo.
# Encabezados y redirecciones están en web/_headers y web/_redirects.
[build]
  command = "node scripts/build.mjs && node scripts/check.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# El contador anónimo de uso (/api/uso) es una función de Netlify que guarda en Netlify Blobs.
[functions]
  directory = "netlify/functions"
